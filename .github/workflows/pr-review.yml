name: PR Review

on:
  pull_request:

jobs:
  lint:
    name: Code style (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run ruff
        run: uv run ruff check backend/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system audio libraries
        run: sudo apt-get install -y libportaudio2

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # uv.lock isn't committed yet (still gitignored on main — see PR #442,
      # "ci: commit uv.lock..."), so `uv sync --locked` would fail here.
      # Switch to `--locked` once a lockfile is committed, for reproducible
      # installs.
      - name: Install dependencies
        run: |
          uv sync
          uv pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          uv pip install torchcrepe

      - name: Run tests
        run: uv run pytest -v
