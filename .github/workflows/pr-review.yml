name: PR Review

on:
  pull_request:

concurrency:
  group: pr-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code style (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # uvx runs ruff in an isolated environment, so this job never needs `uv
      # sync` (skips installing torch/fastapi/etc. just to lint). The version
      # is pinned to match pyproject.toml's [dependency-groups] dev pin
      # (ruff==0.15.5 — 0.16 changes the default rule set); update both together.
      - name: Run ruff
        run: uvx ruff@0.15.5 check backend/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system audio libraries
        run: sudo apt-get install -y libportaudio2

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # uv.lock isn't committed yet (still gitignored on main — see PR #442,
      # "ci: commit uv.lock..."), so `uv sync --locked` would fail here.
      # Switch to `--locked` once a lockfile is committed, for reproducible
      # installs — but note torch/torchcrepe are installed ad hoc via `uv pip
      # install` below (they're optional extras, not core project deps), so
      # they aren't tracked by the lockfile. Once `--locked` is in use, a
      # `uv run` in a later step could re-sync against that lockfile and
      # prune them; installing and running pytest in the same step (as done
      # here) avoids that regardless of lock state.
      - name: Install dependencies and run tests
        run: |
          uv sync
          uv pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          uv pip install torchcrepe
          uv run pytest -v
