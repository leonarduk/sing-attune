[project]
name = "sing-attune-backend"
version = "0.2.0"
description = "sing-attune backend — MusicXML pitch tracking"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "music21>=9.1",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "librosa>=0.11.0",
]


[project.scripts]
sing-attune = "backend.cli:main"

[project.optional-dependencies]
# GPU pitch engine (torchcrepe). torch/torchaudio come from PyTorch's own
# cpu/cu128 wheel indexes (not PyPI) — see [tool.uv.sources]/[tool.uv.index]
# below. `cpu` and `cu128` are mutually exclusive (see [tool.uv.conflicts]);
# pick one:
#   uv sync --extra cpu     # librosa pYIN + torchcrepe running on CPU
#   uv sync --extra cu128   # torchcrepe GPU-accelerated (CUDA 12.8 wheels)
# Versions are pinned exactly (not `>=`) so both extras resolve the same
# torch/torchaudio release — the two indexes don't publish in lockstep, so a
# loose bound can let `cpu` and `cu128` drift to different upstream versions.
# 2.11.0, not 2.10.0: 2.10.0 carries a GHSA/OSV-listed high-severity local
# deserialization CVE (CVE-2026-4538, pt2 loading handler) fixed in 2.11.0 —
# checked via OSV.dev when this pin was added; re-check before bumping again.
cpu = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchcrepe==0.0.24",
]
cu128 = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchcrepe==0.0.24",
]
# Plain `uv sync` (no extra) omits torch entirely — librosa pYIN (a base
# dependency above) is the CPU fallback used by the thin installer build.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "jsonschema>=4.23",
    "httpx>=0.27",
    # Ruff 0.16 changes the default rule set; pin the validated CI rule set.
    "ruff==0.15.5",
    "pyinstaller>=6.16.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

# `explicit = true` so only torch/torchaudio (sourced above) resolve from
# these indexes — other packages keep resolving from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@pytest.mark.hardware",
]
